<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portal Absensi DPRD Sleman</title>
    <link rel="stylesheet" href="/portal/styles.css" />
  </head>
  <body>
    <header>
      <h1>Portal Absensi DPRD Kabupaten Sleman</h1>
      <button id="logout" hidden>Keluar</button>
    </header>

    <main>
      <section id="login" class="card">
        <h2>Masuk</h2>
        <form id="login-form">
          <label>Email<input id="email" type="email" required autocomplete="username" /></label>
          <label>
            Password
            <span class="password-field">
              <input id="password" type="password" required autocomplete="current-password" />
              <button
                type="button"
                class="password-toggle"
                data-password-toggle="password"
                aria-label="Tampilkan password"
                aria-pressed="false"
              >
                <span data-eye-open>
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                    <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6Z" />
                    <circle cx="12" cy="12" r="3" />
                  </svg>
                </span>
                <span data-eye-off hidden>
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                    <path d="M3 3l18 18" />
                    <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8" />
                    <path
                      d="M9.9 4.2A10.8 10.8 0 0 1 12 4c6.5 0 10 6 10 6a17.6 17.6 0 0 1-2.3 3.1"
                    />
                    <path d="M6.2 6.2C3.6 7.8 2 10 2 10s3.5 6 10 6c1 0 2-.1 2.9-.4" />
                  </svg>
                </span>
              </button>
            </span>
          </label>
          <button type="submit">Masuk</button>
        </form>
        <p id="login-error" class="error" hidden></p>
      </section>

      <section id="dashboard" hidden>
        <div class="toolbar">
          <div>
            <h2>Rekap Kehadiran</h2>
            <p id="user-info" class="muted"></p>
          </div>
          <div class="actions">
            <label
              >Fraksi
              <select id="fraksi-filter">
                <option value="">Semua</option>
              </select>
            </label>
            <button id="export">Unduh CSV</button>
          </div>
        </div>

        <div class="card table-wrap">
          <table>
            <thead>
              <tr>
                <th>Nama</th>
                <th>Fraksi</th>
                <th>Partai</th>
                <th>Hadir</th>
                <th>Izin</th>
                <th>Alpha</th>
                <th>Persentase</th>
              </tr>
            </thead>
            <tbody id="rekap-body"></tbody>
          </table>
        </div>

        <h2>Absensi Terbaru</h2>
        <div class="card table-wrap">
          <table>
            <thead>
              <tr>
                <th>Anggota</th>
                <th>Rapat</th>
                <th>Tanggal</th>
                <th>Status</th>
                <th>Jam Masuk</th>
              </tr>
            </thead>
            <tbody id="absensi-body"></tbody>
          </table>
        </div>
      </section>
    </main>

    <script src="/portal/password-toggle.js"></script>
    <script src="/portal/app.js"></script>
  </body>
</html>
