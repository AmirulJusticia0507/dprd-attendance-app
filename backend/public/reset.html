<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password</title>
    <link rel="stylesheet" href="/portal/styles.css" />
  </head>
  <body>
    <header><h1>Reset Password DPRD Attendance App</h1></header>
    <main>
      <section id="reset" class="card" style="max-width: 420px; margin: 60px auto">
        <h2>Atur Password Baru</h2>
        <form id="reset-form">
          <label>
            Password Baru
            <span class="password-field">
              <input
                id="new-password"
                type="password"
                minlength="8"
                required
                autocomplete="new-password"
              />
              <button
                type="button"
                class="password-toggle"
                data-password-toggle="new-password"
                aria-label="Tampilkan password"
                aria-pressed="false"
              >
                <span data-eye-open>
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                    <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6Z" />
                    <circle cx="12" cy="12" r="3" />
                  </svg>
                </span>
                <span data-eye-off hidden>
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                    <path d="M3 3l18 18" />
                    <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8" />
                    <path
                      d="M9.9 4.2A10.8 10.8 0 0 1 12 4c6.5 0 10 6 10 6a17.6 17.6 0 0 1-2.3 3.1"
                    />
                    <path d="M6.2 6.2C3.6 7.8 2 10 2 10s3.5 6 10 6c1 0 2-.1 2.9-.4" />
                  </svg>
                </span>
              </button>
            </span>
          </label>
          <button type="submit">Simpan</button>
        </form>
        <p id="message" hidden></p>
      </section>
    </main>
    <script src="/portal/password-toggle.js"></script>
    <script>
      const form = document.getElementById('reset-form');
      const message = document.getElementById('message');
      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const token = new URLSearchParams(location.search).get('token') || '';
        const response = await fetch('/api/auth/reset', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            token,
            newPassword: document.getElementById('new-password').value,
          }),
        });
        const body = await response.json();
        message.textContent = body.error || body.message;
        message.hidden = false;
        if (response.ok) form.reset();
      });
    </script>
  </body>
</html>
