  <!-- Pillars -->
  <rect x="156" y="240" width="24" height="96" rx="4" fill="#f8fafc" />
  <rect x="214" y="240" width="24" height="96" rx="4" fill="#f8fafc" />
  <rect x="274" y="240" width="24" height="96" rx="4" fill="#f8fafc" />
  <rect x="332" y="240" width="24" height="96" rx="4" fill="#f8fafc" />

  <!-- Base Steps -->
  <rect x="116" y="336" width="280" height="18" rx="4" fill="#38bdf8" />
  <rect x="96" y="354" width="320" height="20" rx="4" fill="url(#goldGrad)" />

  <!-- Checkmark Badge -->
  <circle cx="346" cy="341" r="54" fill="url(#badgeGrad)" stroke="#0f172a" stroke-width="8" />
  <polyline points="322,341 338,358 370,326" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
