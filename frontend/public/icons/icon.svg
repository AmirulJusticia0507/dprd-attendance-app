  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" stroke="#8b5cf6" stroke-width="8" />

  <!-- Dome -->
  <path d="M146 216 A110 110 0 0 1 366 216 Z" fill="url(#goldGrad)" />

